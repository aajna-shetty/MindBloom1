<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindBloom Webcam Verification</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 5px; }
    button { margin: 16px 8px 0 0; padding: 10px 14px; cursor: pointer; }
    video { width: 100%; max-height: 440px; background: #111; margin-top: 18px; }
    #result { white-space: pre-wrap; background: #f3f3f3; padding: 12px; margin-top: 18px; }
    .hint { color: #555; }
  </style>
</head>
<body>
  <h1>MindBloom Webcam Verification</h1>
  <p class="hint">
    Enroll a reference photo first, then use this page to check whether the person
    in the webcam matches that profile.
  </p>

  <label for="token">Bearer token</label>
  <input id="token" type="password" placeholder="Paste the access_token from /auth/login">

  <label for="childId">Child ID</label>
  <input id="childId" type="number" min="1" placeholder="Example: 5">

  <label for="duration">Recording duration (seconds)</label>
  <input id="duration" type="number" min="3" max="60" value="10">

  <button id="start">Start webcam</button>
  <button id="stop" disabled>Stop and analyze</button>

  <video id="preview" autoplay muted playsinline></video>
  <div id="result">Camera is not started.</div>

  <script>
    const token = document.getElementById("token");
    const childId = document.getElementById("childId");
    const duration = document.getElementById("duration");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    let stream;
    let recorder;
    let chunks = [];
    let timer;
    let challengeToken;
    let challengeAction;

    function show(value) {
      result.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    function authHeaders() {
      const value = token.value.trim();
      return value.toLowerCase().startsWith("bearer ")
        ? value
        : `Bearer ${value}`;
    }

    async function stopTracks() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    async function analyze() {
      const blob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
      const form = new FormData();
      form.append("file", blob, "webcam-check.webm");
      form.append("child_id", childId.value);
      form.append("duration_seconds", duration.value);
      form.append("enforce_verification", "true");
      form.append("challenge_token", challengeToken);

      show("Uploading webcam recording and checking identity...");
      const response = await fetch("/video/analyze/upload", {
        method: "POST",
        headers: { Authorization: authHeaders() },
        body: form
      });
      const text = await response.text();
      let payload;
      try { payload = JSON.parse(text); } catch { payload = text; }
      show(`HTTP ${response.status}\n\n${typeof payload === "string" ? payload : JSON.stringify(payload, null, 2)}`);
    }

    startButton.addEventListener("click", async () => {
      try {
        if (!token.value.trim() || !childId.value) {
          show("Enter the bearer token and child ID first.");
          return;
        }
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        const challengeResponse = await fetch("/video/challenge", { method: "POST", headers: { Authorization: authHeaders() } });
        if (!challengeResponse.ok) throw new Error("Could not obtain a liveness challenge.");
        const challenge = await challengeResponse.json();
        challengeToken = challenge.challenge;
        challengeAction = challenge.action;
        preview.srcObject = stream;
        chunks = [];
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp8")
          ? "video/webm;codecs=vp8"
          : "video/webm";
        recorder = new MediaRecorder(stream, { mimeType });
        recorder.ondataavailable = event => {
          if (event.data.size > 0) chunks.push(event.data);
        };
        recorder.onstop = async () => {
          await stopTracks();
          startButton.disabled = false;
          stopButton.disabled = true;
          try { await analyze(); } catch (error) { show(`Request failed: ${error}`); }
        };
        recorder.start();
        startButton.disabled = true;
        stopButton.disabled = false;
        const instructions = { blink: "Blink twice", turn_left: "Turn your head left", turn_right: "Turn your head right", nod: "Nod your head" };
        show(`Challenge: ${instructions[challengeAction]}. Complete it while facing the webcam.`);
        timer = setTimeout(() => stopButton.click(), Number(duration.value) * 1000);
      } catch (error) {
        await stopTracks();
        show(`Could not access the webcam: ${error.message}`);
      }
    });

    stopButton.addEventListener("click", () => {
      clearTimeout(timer);
      if (recorder && recorder.state !== "inactive") recorder.stop();
    });
  </script>
</body>
</html>
