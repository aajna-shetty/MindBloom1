services:
  db:
    image: postgres:16-alpine
    container_name: mindbloom_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aajna
      POSTGRES_DB: mindbloom
    ports:
      - "5435:5432"
    volumes:
      - mindbloom_db_data:/var/lib/postgresql/data

volumes:
  mindbloom_db_data: