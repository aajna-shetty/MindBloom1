[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --ignore=tests/test_deepface.py --ignore=tests/test_deepface_visual.py --ignore=tests/test_emotion_visual.py --ignore=tests/test_startup_timing.py
filterwarnings =
    ignore::DeprecationWarning
